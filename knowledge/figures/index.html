d #ccc"><figcaption><b>spec-table-mig</b> (Manual p.7)<br>Specifications table for MIG and flux-cored: power input, current input at output, welding current range, rated duty cycles, maximum OCV, weldable materials, wire capacity, wire speed and spool capacity, for 120V and 240V</figcaption></figure><figure style="margin:0;max-width:440px"><img src="spec-table-tig.png" width="420" style="border:1px solid #ccc"><figcaption><b>spec-table-tig</b> (Manual p.7)<br>Specifications table for TIG: power input, current input at output, welding current range, rated duty cycles, maximum OCV and weldable materials, for 120V and 240V</figcaption></figure><figure style="margin:0;max-width:440px"><img src="spec-table-stick.png" width="420" style="border:1px solid #ccc"><figcaption><b>spec-table-stick</b> (Manual p.7)<br>Specifications table for Stick: power input, current input at output, welding current range, rated duty cycles, maximum OCV and weldable materials, for 120V and 240V</figcaption></figure><figure style="margin:0;max-width:440px"><img src="front-panel-controls.png" width="420" style="border:1px solid #ccc"><figcaption><b>front-panel-controls</b> (Manual p.8)<br>Front panel controls, labelled: Home and Back buttons, Control Knob, Left Knob, Right Knob, LCD display, Power Switch, MIG Gun / Spool Gun cable socket, Spool Gun gas outlet, Negative and Positive sockets, Wire Feed Power Cable socket and the storage compartment</figcaption></figure><figure style="margin:0;max-width:440px"><img src="interior-controls.png" width="420" style="border:1px solid #ccc"><figcaption><b>interior-controls</b> (Manual p.9)<br>Interior controls, labelled: wire spool and spool knob, wire inlet liner, wire feed mechanism, feed tensioner, idler arm, feed roller knob, cold wire feed switch, foot pedal socket and wire feed control socket</figcaption></figure><figure style="margin:0;max-width:440px"><img src="gun-cable-connection.png" width="420" style="border:1px solid #ccc"><figcaption><b>gun- input-socket.png" width="420" style="border:1px solid #ccc"><figcaption><b>power-input-socket</b> (Manual p.16)<br>Step 24: plug either the 120VAC or the 240VAC power cord into the Power Input socket on the back of the welder (the plug fits only one way); the back panel also carries the rating label</figcaption></figure><figure style="margin:0;max-width:440px"><img src="power-cord-and-switch.png" width="420" style="border:1px solid #ccc"><figcaption><b>power-cord-and-switch</b> (Manual p.16)<br>Step 25: plug the power cord into a properly grounded, GFCI protected 120VAC (20 amp rated) or 240VAC receptacle that matches the plug, then turn the Power Switch ON (delayed action-type breaker or fuses)</figcaption></figure><figure style="margin:0;max-width:440px"><img src="cold-wire-feed-step.png" width="420" style="border:1px solid #ccc"><figcaption><b>cold-wire-feed-step</b> (Manual p.16)<br>Step 26: with the gun pointed away from everything, hold the Cold Wire Feed Switch until the wire feeds through two inches; the wire liner may come out with the wire (push it back in), and what to do if the wire does not feed and the spool is stationary</figcaption></figure><figure style="margin:0;max-width:440px"><img src="rating-label.png" width="420" style="border:1px solid #ccc"><figcaption><b>rating-label</b> (Manual p.16)<br>The rating label on the welder&#x27;s back panel: for 240V and 120V it lists MIG, TIG and Stick current ranges with the rated duty cycle points (X = 25%, 60%, 100% on 240V; 40%, 60%, 100% on 120V), amps I2, volts U2 and input current</figcaption></figure><figure style="margin:0;max-width:440px"><img src="wire-tension-test.png" width="420" style="border:1px solid #ccc"><figcaption><b>wire-tension-test</b> (Manual p.17)<br>Step 27: checking the wire drive tension: press the trigger to feed the wire against a piece of wood 2 to 3 inches away; if the wire stops, tighten the Feed Tensioner slightly clockwise, and if it bends the tension is set properly</figcaption></figure><figure style="margin:0;max-width:440px"><img src="nozzle-contact-tip.png" width="420" style="border:1px solid #ccc"><figcaption><b>nozzle-contact-tip</b> (Manual p.17)<br>Steps 28 to 31: with the welder unplugged, fit a compatible contact tip, replace the nozzle and cut the wire to 1/2 inch stickout; picture of the nozzle, contact tip and MIG gun</figcaption></figure><figure style="margin:0;max-width:440px"><img src="spool-gun-setup.png" width="420" style="border:1px solid #ccc"><figcaption><b>spool-gun-setup</b> (Manual p.17)<br>Optional Spool Gun setup: Ground Clamp Cable in the Negative socket, Wire Feed Power Cable in the Positive socket, spool gun cable connector into the wire feed, wire feed control cable and the gas hose to the Spool Gun Gas Outlet</figcaption></figure><figure style="margin:0;max-width:440px"><img src="wire-bead-types.png" width="420" style="border:1px solid #ccc"><figcaption><b>wire-bead-types</b> (Manual p.22)<br>Steps 1 and 2: the stringer bead (a steady straight line) and the weave bead (back and forth across the joint), with a picture of each</figcaption></figure><figure style="margin:0;max-width:440px"><img src="mig-gun-angles-fillet-butt.png" width="420" style="border:1px solid #ccc"><figcaption><b>mig-gun-angles-fillet-butt</b> (Manual p.22)<br>Step 3: weld MIG gun angles viewed from the front of the joint: 45 degrees for a fillet (T-shaped) joint and 90 degrees for a butt joint</figcaption></figure><figure style="margin:0;max-width:440px"><img src="push-drag-angle-and-ctwd.png" width="420" style="border:1px solid #ccc"><figcaption><b>push-drag-angle-and-ctwd</b> (Manual p.22)<br>Steps 4 to 6: push angle for solid wire with shielding gas and drag angle for flux-cored wire without gas (0 to 15 degrees), and CTWD (contact tip to work distance) up to 1/2 inch</figcaption></figure><figure style="margin:0;max-width:440px"><img src="tig-stick-safety-notice.png" width="420" style="border:1px solid #ccc"><figcaption><b>tig-stick- so the tip protrudes 1/8 to 1/4 inch beyond the ceramic nozzle</figcaption></figure><figure style="margin:0;max-width:440px"><img src="tig-torch-assembly.png" width="420" style="border:1px solid #ccc"><figcaption><b>tig-torch-assembly</b> (Manual p.26)<br>Assemble the TIG torch (steps 1 to 8): consult the Settings Chart on top of the welder for the tungsten size, match the collet and collet body, thread on the ceramic nozzle, insert the collet and the tungsten and lock with the back cap (1/8 to 1/4 inch protruding); exploded picture with back cap, collet, collet body and ceramic nozzle</figcaption></figure><figure style="margin:0;max-width:440px"><img src="stick-cable-setup.png" width="420" style="border:1px solid #ccc"><figcaption><b>stick-cable-setup</b> (Manual p.27)<br>Stick setup, connect cables (steps 1 and 2): Ground Clamp Cable in the Negative socket and Electrode Holder Cable in the Positive socket</figcaption></figure><figure style="margin:0;max-width:440px"><img src="stick-power-cord-connect.png" width="420" style="border:1px solid #ccc"><figcaption><b>stick-power-cord-connect</b> (Manual p.27)<br>Connect power cord (Stick): plug either the 120VAC or 240VAC power cord into the Power Input socket (the plug fits only one way); WARNING do not plug the cord into the wall outlet at this time</figcaption></figure><figure style="margin:0;max-width:440px"><img src="tig-stick-protective-gear-warning.png" width="420" style="border:1px solid #ccc"><figcaption><b>tig-stick-protective-gear-warning</b> (Manual p.28)<br>Basic TIG/Stick welding: WARNING protective gear (minimum shade number 10 full face shield, ear protection, welding gloves, sleeves and apron, NIOSH-approved respirator, fire resistant clothes), what DC TIG, AC TIG and Stick weld, and practice on scrap, with the hazard pictograms</figcaption></figure><figure style="margin:0;max-width:440px"><img src="energized-tip-fire-warning.png" width="420" style="border:1px solid #ccc"><figcaption><b>energized-tip-fire-warning</b> (Manual p.28)<br>WARNING fire and burns: keep the welding tip clear of grounded objects whenever the unit is plugged in and turned on (with the Power Switch on, the torch is energized)</figcaption></figure><figure style="margin:0;max-width:440px"><img src="duty-cycle-section-tig-stick.png" width="420" style="border:1px solid #ccc"><figcaption><b>duty-cycle-section-tig-stick</b> (Manual p.29)<br>Duty cycle (duration of use) for TIG and Stick: what it means (a 40% duty cycle at 125A means 4 minutes welding and 6 minutes rest), the thermal protection, and the TIG and Stick rated duty cycle dials for 240VAC and 120VAC with minutes welding and resting and the 100% continuous amps</figcaption></figure><figure style="margin:0;max-width:440px"><img src="weld-setup-clamping.png" width="420" style="border:1px solid #ccc"><figcaption><b>weld-setup-clamping</b> (Manual p.29)<br>Setting up the weld (steps 1 and 2): practice on scrap of the same thickness, clean to bare metal, clamp the workpieces and chamfer thick ones; the NOTICE to disconnect the vehicle battery before welding on a vehicle</figcaption></figure><figure style="margin:0;max-width:440px"><img src="ground-clamp-to-workpiece.png" width="420" style="border:1px solid #ccc"><figcaption><b>ground-clamp-to-workpiece</b> (Manual p.29)<br>Setting up the weld (step 3): clamp the ground cable to bare metal on the workpiece or on the metal work bench where it is clamped; the ground connection depends on the desired welding polarity</figcaption></figure><figure style="margin:0;max-width:440px"><img src="tig-select-process-panel.png" width="420" style="border:1px solid #ccc"><figcaption><b>tig-select-process-panel</b> (Manual p.30)<br>TIG welding steps 6 to 8: press Home, turn the Main Control Knob until TIG appears on the LCD and press it to select; the front panel shows the Left Knob, Main Control Knob and Right Knob</figcaption></figure><figure style="margin:0;max-width:440px"><img src="tig-lcd-polarity-gas-screen.png" width="420" style="border:1px solid #ccc"><figcaption><b>tig-lcd-polarity-gas-screen</b> (Manual p.30)<br>TIG step 9a LCD screen, polarity and gas settings: plug the cables in according to the screen (torch to Negative, ground clamp to Positive), connect the gas and set SCFH between 10 and 25; the screen shows 100% Argon</figcaption></figure><figure style="margin:0;max-width:440px"><img src="tig-lcd-rod-diameter-thickness.png" width="420" style="border:1px solid #ccc"><figcaption><b>tig-lcd-rod-diameter-thickness</b> (Manual p.30)<br>TIG step 9b LCD screen: set the rod diameter with the Left Knob and the material thickness with the Right Knob (example screen: 1/16 inch and 24 Ga)</figcaption></figure><figure style="margin:0;max-width:440px"><img src="tig-lcd-auto-weld-screen.png" width="420" style="border:1px solid #ccc"><figcaption><b>tig-lcd-auto-weld-screen</b> (Manual p.30)<br>TIG step 9c LCD screen, Auto Weld settings: Left Knob adjusts the output amperage and Right Knob ON energizes the TIG torch; WARNING the welder is energized and open circuit voltage is present; labels for process, gas type, rod diameter and material thickness</figcaption></figure><figure style="margin:0;max-width:440px"><img src="tig-optional-settings-screens.png" width="420" style="border:1px solid #ccc"><figcaption><b>tig-optional-settings-screens</b> (Manual p.31)<br>TIG optional settings (step d of the settings): Recall Setting and Save Setting (up to 5 configurations) with the two LCD screens, and the note that the initial settings may need adjusting after inspecting the weld</figcaption></figure><figure style="margin:0;max-width:440px"><img src="stick-select-process-panel.png" width="420" style="border:1px solid #ccc"><figcaption><b>stick-select-process-panel</b> (Manual p.32)<br>Stick welding steps 4 to 6: press Home, turn the Main Control Knob until Stick appears on the LCD and press it to select STICK; the front panel shows the Left Knob, Main Control Knob and Right Knob</figcaption></figure><figure style="margin:0;max-width:440px"><img src="stick-lcd-polarity-screen.png" width="420" style="border:1px solid #ccc"><figcaption><b>stick-lcd-polarity-screen</b> (Manual p.32)<br>Stick step 7a LCD screen, polarity setting: plug the cables in according to the screen (ground clamp to Negative, electrode holder to Positive); the screen shows No Gas Required</figcaption></figure><figure style="margin:0;max-width:440px"><img src="stick-lcd-electrode-type-screen.png" width="420" style="border:1px solid #ccc"><figcaption><b>stick-lcd-electrode-type-screen</b> (Manual p.32)<br>Stick step 7b LCD screen: set the electrode type with the Main Control Knob (example screen: 60xx)</figcaption></figure><figure style="margin:0;max-width:440px"><img src="stick-lcd-diameter-thickness-screen.png" width="420" style="border:1px solid #ccc"><figcaption><b>stick-lcd-diameter-thickness-screen</b> (Manual p.32)<br>Stick step 7c LCD screen: Left Knob sets the electrode diameter and Right Knob sets the material thickness (example screen: 3/32 inch and 16 Ga)</figcaption></figure><figure style="margin:0;max-width:440px"><img src="stick-lcd-auto-weld-screen.png" width="420" style="border:1px solid #ccc"><figcaption><b>stick-lcd-auto-weld-screen</b> (Manual p.32)<br>Stick step 7d LCD screen, Auto Weld settings: Left Knob adjusts the output amperage and Right Knob ON energizes the electrode holder; WARNING the welder is energized and open circuit voltage is present; labels for process, electrode type, hot start, arc force, electrode diameter and material thickness</figcaption></figure><figure style="margin:0;max-width:440px"><img src="stick-optional-settings-screens.png" width="420" style="border:1px solid #ccc"><figcaption><b>stick-optional-settings-screens</b> (Manual p.33)<br>Stick optional settings (step e of the settings): Hot Start (amperage at the start of the weld), Arc Force (weld penetration and smoothness), Recall Setting and Save Setting (up to 5 configurations) with their four LCD screens</figcaption></figure><figure style="margin:0;max-width:440px"><img src="wire-loading-hold-wire-steps.png" width="420" style="border:1px solid #ccc"><figcaption><b>wire-loading-hold-wire-steps</b> (Manual p.15)<br>IMPORTANT: hold the end of the welding wire and keep tension on it while loading so it does not unravel; steps 18 and 19: cut off bent wire to a clean end and guide at least 12 inches of wire into the Wire Inlet Liner and Feed Guide, with the picture of the hand holding the wire</figcaption></figure><figure style="margin:0;max-width:440px"><img src="idler-arm-and-feed-tensioner-latch.png" width="420" style="border:1px solid #ccc"><figcaption><b>idler-arm-and-feed-tensioner-latch</b> (Manual p.15)<br>Step 20: rest the wire in the feed roller groove, push the Idler Arm down and swing the Feed Tensioner up to latch across it; the note gives the tension as 3-5 for solid wire and 2-3 for flux-cored wire</figcaption></figure><figure style="margin:0;max-width:440px"><img src="remove-nozzle-and-contact-tip.png" width="420" style="border:1px solid #ccc"><figcaption><b>remove-nozzle-and-contact-tip</b> (Manual p.15)<br>Steps 21 to 23: pull the nozzle off, unscrew the contact tip counterclockwise and remove it, and lay the MIG gun cable out in a straight line; picture of the nozzle, contact tip and MIG gun</figcaption></figure><figure style="margin:0;max-width:440px"><img src="stainless-wire-important-note.png" width="420" style="border:1px solid #ccc"><figcaption><b>stainless-wire-important-note</b> (Manual p.15)<br>IMPORTANT: stainless steel wire is less flexible and harder to feed through the liner and gun, so keep the gun cable straight while feeding stainless steel wire</figcaption></figure><figure style="margin:0;max-width:440px"><img src="duty-cycle-section-mig.png" width="420" style="border:1px solid #ccc"><figcaption><b>duty-cycle-section-mig</b> (Manual p.19)<br>Duty cycle (duration of use) for MIG and flux-cored: what it means (a 40% duty cycle at 100A needs at least 6 minutes of rest after every 4 minutes of welding), the thermal protection, and the rated duty cycle dials: 120VAC 40% at 100A (4 minutes welding, 6 resting, 100% continuous at 75A) and 240VAC 25% at 200A (2-1/2 minutes welding, 7-1/2 resting, 100% continuous at 115A)</figcaption></figure><figure style="margin:0;max-width:440px"><img src="overheat-warning-screen.png" width="420" style="border:1px solid #ccc"><figcaption><b>overheat-warning-screen</b> (Manual p.23)<br>Note: if the welder is used too long a warning screen appears on the LCD and the unit shuts down; picture of the LCD display and the Warning Screen table (duty cycle exceeded, low voltage input, high voltage input) with their remedies; rest the MIG gun on a heat-proof surface and let the welder cool with the power switch on</figcaption></figure><figure style="margin:0;max-width:440px"><img src="follow-duty-cycle-box.png" width="420" style="border:1px solid #ccc"><figcaption><b>follow-duty-cycle-box</b> (Manual p.23)<br>Step 7: after welding a test weld on scrap for a few seconds, stop and examine the weld, then follow the duty cycle dials: 120VAC 40% at 100A (4 minutes welding, 6 resting, 100% continuous at 75A) and 240VAC 25% at 200A (2-1/2 minutes welding, 7-1/2 resting, 100% continuous at 115A)</figcaption></figure><figure style="margin:0;max-width:440px"><img src="shutdown-and-storage-steps.png" width="420" style="border:1px solid #ccc"><figcaption><b>shutdown-and-storage-steps</b> (Manual p.23)<br>Steps 8 to 12: when finished, set the MIG gun on a heat-proof non-conductive surface such as a concrete slab and turn the power switch off, let the welder cool and unplug it, remove the ground clamp, respool the wire, and (MIG only) close the gas cylinder valve and disconnect the regulator and gas hose</figcaption></figure><figure style="margin:0;max-width:440px"><img src="maintenance-warning-and-inspection.png" width="420" style="border:1px solid #ccc"><figcaption><b>maintenance-warning-and-inspection</b> (Manual p.41)<br>Maintenance: WARNING unplug the welder, rest it on a heat-proof non-conductive surface and let it cool before service; inspect before each use (loose hardware, damaged cords or cables, cracked parts), have a qualified technician blow out interior dust periodically, store clean and dry after every use, and clean the MIG gun contact tip and nozzle before each use</figcaption></figure><figure style="margin:0;max-width:440px"><img src="mig-nozzle-contact-tip-cleaning.png" width="420" style="border:1px solid #ccc"><figcaption><b>mig-nozzle-contact-tip-cleaning</b> (Manual p.41)<br>MIG gun nozzle and contact tip inspection and cleaning (steps 1 to 9): let the gun cool and unplug the welder, remove and scrub the nozzle and check that it is flat and even, unscrew the contact tip counterclockwise and clean it, check that the hole is an even circle, replace it if worn and reinstall; picture of the nozzle and contact tip</figcaption></figure><figure style="margin:0;max-width:440px"><img src="lcd-screen-cover-replacement.png" width="420" style="border:1px solid #ccc"><figcaption><b>lcd-screen-cover-replacement</b> (Manual p.41)<br>Replacing the LCD screen cover (steps 1 to 3): pry the frame off the Display (22) with a flathead screwdriver in a side slot, insert the new Screen Cover (17) into the Screen Frame (18) with the gap facing downward, and insert the frame back into the slot with the top end in first</figcaption></figure><figure style="margin:0;max-width:440px"><img src="troubleshooting-table-mig-flux-cored-p42.png" width="420" style="border:1px solid #ccc"><figcaption><b>troubleshooting-table-mig-flux-cored-p42</b> (Manual p.42)<br>Troubleshooting table for MIG and flux-cored welding, first part: wire feed motor runs but wire does not feed properly, wire creates a bird&#x27;s nest, wire stops during welding, welding arc not stable and weak arc strength, each with possible causes and likely solutions</figcaption></figure><figure style="margin:0;max-width:440px"><img src="troubleshooting-table-mig-flux-cored-p43.png" width="420" style="border:1px solid #ccc"><figcaption><b>troubleshooting-table-mig-flux-cored-p43</b> (Manual p.43)<br>Troubleshooting table for MIG and flux-cored welding, second part: welder does not function when switched on, LCD display does not light, wire feeds but arc does not ignite and porosity in the weld metal, each with possible causes and likely solutions</figcaption></figure><figure style="margin:0;max-width:440px"><img src="troubleshooting-table-tig-stick-p44.png" width="420" style="border:1px solid #ccc"><figcaption><b>troubleshooting-table-tig-stick-p44</b> (Manual p.44)<br>Troubleshooting table for TIG and Stick welding: welder does not function when switched on, LCD display does not light, weak arc strength and welding arc not stable, with possible causes and likely solutions</figcaption></figure><figure style="margin:0;max-width:440px"><img src="wiring-schematic.png" width="420" style="border:1px solid #ccc"><figcaption><b>wiring-schematic</b> (Manual p.45)<br>Wiring schematic of the welder: the main board with IGBT and PFC sections, rectifiers, transformer, output terminals OUT+ and OUT-, MCU board, LCD screen, remote board, wire feeder motor, solenoid valves, fast wire feed switch, fans and the AC input</figcaption></figure><figure style="margin:0;max-width:440px"><img src="parts-list-table.png" width="420" style="border:1px solid #ccc"><figcaption><b>parts-list-table</b> (Manual p.46)<br>Parts list (parts 1 to 61 with description and quantity) for the assembly diagram on the next page</figcaption></figure><figure style="margin:0;max-width:440px"><img src="parts-ordering-notes.png" width="420" style="border:1px solid #ccc"><figcaption><b>parts-ordering-notes</b> (Manual p.46)<br>Record the product&#x27;s date code here; note that some parts are listed for illustration only and are not available individually, parts may not be interchangeable, and to specify UPC 193175422590 when ordering parts</figcaption></figure><figure style="margin:0;max-width:440px"><img src="assembly-diagram.png" width="420" style="border:1px solid #ccc"><figcaption><b>assembly-diagram</b> (Manual p.47)<br>Assembly diagram: exploded view of the welder with each part numbered 1 to 61 (match the numbers to the parts list on page 46)</figcaption></figure><figure style="margin:0;max-width:440px"><img src="manual-cover-page.png" width="420" style="border:1px solid #ccc"><figcaption><b>manual-cover-page</b> (Manual p.1)<br>Cover of the owner&#x27;s manual: Vulcan OmniPro 220 multiprocess welding system, item 57812, with the photo of the welder, the technical support contact, the unpacking note and the WARNING to read the material before use</figcaption></figure><figure style="margin:0;max-width:440px"><img src="table-of-contents.png" width="420" style="border:1px solid #ccc"><figcaption><b>table-of-contents</b> (Manual p.2)<br>Table of contents: Safety 2, Specifications 7, Controls 8, MIG/Flux-Cored Wire Welding 10, TIG/Stick Welding 24, Welding Tips 34, Maintenance 41, Parts List and Diagram 46, Warranty 48</figcaption></figure><figure style="margin:0;max-width:440px"><img src="warning-symbols-and-definitions.png" width="420" style="border:1px solid #ccc"><figcaption><b>warning-symbols-and-definitions</b> (Manual p.2)<br>Warning symbols and definitions: the safety alert symbol, DANGER (will result in death or serious injury), WARNING (could result in death or serious injury), CAUTION (could result in minor or moderate injury) and NOTICE (practices not related to personal injury) as they look in the manual</figcaption></figure><figure style="margin:0;max-width:440px"><img src="general-safety-rules.png" width="420" style="border:1px solid #ccc"><figcaption><b>general-safety-rules</b> (Manual p.2)<br>Important safety information, General Safety items 1 to 8: read the instructions, keep children away, place the welder on a stable surface, do not overreach, stay alert and sober, avoid unintentional starting, never leave the welder energized and unattended, and use common sense</figcaption></figure><figure style="margin:0;max-width:440px"><img src="fume-and-gas-safety.png" width="420" style="border:1px solid #ccc"><figcaption><b>fume-and-gas-safety</b> (Manual p.3)<br>Fume and gas safety (items 1 to 6): welding fumes are toxic, do not use near degreasing or painting, keep your head out of the fumes, use enough ventilation or an approved respirator, and work in a confined area only if well ventilated</figcaption></figure><figure style="margin:0;max-width:440px"><img src="arc-ray-safety.png" width="420" style="border:1px solid #ccc"><figcaption><b>arc-ray-safety</b> (Manual p.3)<br>Arc ray safety (items 1 to 6): wear ANSI-approved eye protection with at least a number 10 shade lens, leather leggings and fire resistant shoes, clothing free of grease and oil, a head covering, a welding jacket or long sleeves, and ear plugs when welding overhead or in confined spaces</figcaption></figure><figure style="margin:0;max-width:440px"><img src="electrical-safety.png" width="420" style="border:1px solid #ccc"><figcaption><b>electrical-safety</b> (Manual p.4)<br>Electrical safety (items 1 to 10): electric shock can kill; turn off and disconnect power, do not touch energized parts, use a grounded GFCI-protected supply, do not use near water, pacemaker warning, do not expose to rain, do not abuse the cord, do not use outdoors, and insulate yourself from the workpiece</figcaption></figure><figure style="margin:0;max-width:440px"><img src="fire-safety.png" width="420" style="border:1px solid #ccc"><figcaption><b>fire-safety</b> (Manual p.4)<br>Fire safety (items 1 to 9): arc and slag can cause fire; clear flammable objects for 35 feet (10 meters), keep an ABC-type fire extinguisher near, do not weld on combustible coatings, do not put hot slag in containers of combustibles, and examine the area for fire after welding</figcaption></figure><figure style="margin:0;max-width:440px"><img src="welder-use-and-care.png" width="420" style="border:1px solid #ccc"><figcaption><b>welder-use-and-care</b> (Manual p.5)<br>Welder use and care (items 1 to 6): do not use the welder if the switch does not work, disconnect the plug before adjustments, prevent unintentional starting, store it away from children, use it as instructed, and do not use it for pipe thawing</figcaption></figure><figure style="margin:0;max-width:440px"><img src="maintenance-safety-rules.png" width="420" style="border:1px solid #ccc"><figcaption><b>maintenance-safety-rules</b> (Manual p.5)<br>Maintenance safety rules (items 1 to 4): maintain the welder, have it serviced with identical replacement parts, keep labels and nameplates readable, and unplug it before maintenance</figcaption></figure><figure style="margin:0;max-width:440px"><img src="cylinder-safety-and-save-instructions.png" width="420" style="border:1px solid #ccc"><figcaption><b>cylinder-safety-and-save-instructions</b> (Manual p.5)<br>Gas shielded welding cylinder safety (items 1 to 7): cylinders can explode when damaged; do not weld on a pressurized cylinder, keep the cap on, keep cylinders away from electrical circuits, use the right gas equipment, protect cylinders from heat; SAVE THESE INSTRUCTIONS</figcaption></figure><figure style="margin:0;max-width:440px"><img src="grounding-extension-and-replacement-cords.png" width="420" style="border:1px solid #ccc"><figcaption><b>grounding-extension-and-replacement-cords</b> (Manual p.6)<br>Grounding WARNING (items 1 and 2) to prevent electric shock: check the outlet is properly grounded and never modify the plug; Extension Cords: do not use an extension cord on this welder; Replacement Cords (items 1 to 3): use only a supplied or identical cord, no thinner or longer cord, and do not patch cords together</figcaption></figure><figure style="margin:0;max-width:440px"><img src="symbology-table.png" width="420" style="border:1px solid #ccc"><figcaption><b>symbology-table</b> (Manual p.6)<br>Symbology: the symbols and abbreviations on the welder and what they mean (wire feed speed, workpiece ground cable, torch cable, overheat shutdown indicator, cooling fan, housing ground point, VAC, A, OCV, KVA, IPM, AWG) and the hazard icons for electric shock, inhalation, read manual, fire, arc ray and pacemaker</figcaption></figure><figure style="margin:0;max-width:440px"><img src="wire-setup-power-off-and-door.png" width="420" style="border:1px solid #ccc"><figcaption><b>wire-setup-power-off-and-door</b> (Manual p.10)<br>MIG/flux-cored wire welding setup: WARNING turn the Power Switch off and unplug the welder before setup, remove the protective foam and cardboard; Wire Spool Installation steps 1 and 2: turn the power switch off and unplug, then pull up on the door latch and open the door</figcaption></figure><figure style="margin:0;max-width:440px"><img src="wire-spool-installation-1-2-lb.png" width="420" style="border:1px solid #ccc"><figcaption><b>wire-spool-installation-1-2-lb</b> (Manual p.10)<br>1-2 pound wire spool installation (steps 3 to 5): remove the wingnut and spacer, place the spool on the spindle against the spool brake pad so it unwinds clockwise, then replace the spacer and wingnut; a spool that spins freely means the wingnut is too loose; picture of the 1-2 lb spool loading</figcaption></figure><figure style="margin:0;max-width:440px"><img src="wire-spool-installation-10-12-lb.png" width="420" style="border:1px solid #ccc"><figcaption><b>wire-spool-installation-10-12-lb</b> (Manual p.11)<br>10-12 pound wire spool installation (steps 6 to 10): remove the wingnut and spacer, place the spool adapter and then the spool (pin lined up with the hole) so it unwinds clockwise, replace the spacer and wingnut, and screw the spool knob into the spool adapter; pictures of the 10-12 lb spool loading and the direction the wire must unwind</figcaption></figure><figure style="margin:0;max-width:440px"><img src="release-feed-tension-step.png" width="420" style="border:1px solid #ccc"><figcaption><b>release-feed-tension-step</b> (Manual p.11)<br>Step 11: turn the Feed Tensioner knob counterclockwise to loosen it enough to pull it down and remove tension; the spring-loaded Idler Arm moves up, as shown in the two pictures</figcaption></figure><figure style="margin:0;max-width:440px"><img src="basic-wire-welding-gear-and-processes.png" width="420" style="border:1px solid #ccc"><figcaption><b>basic-wire-welding-gear-and-processes</b> (Manual p.18)<br>Basic wire welding: WARNING protective gear (minimum shade number 10 full face shield, ear protection, gloves, sleeves and apron, NIOSH-approved respirator, fire resistant clothes), what flux-cored and MIG welding are used for, the optional Spool Gun for aluminum, and practice on scrap, with the hazard pictograms</figcaption></figure><figure style="margin:0;max-width:440px"><img src="wire-welding-fire-warning.png" width="420" style="border:1px solid #ccc"><figcaption><b>wire-welding-fire-warning</b> (Manual p.18)<br>WARNING fire and burns: keep the welding tip clear of grounded objects whenever the unit is plugged in and turned on (the MIG gun is energized when the Power Switch is on)</figcaption></figure><figure style="margin:0;max-width:440px"><img src="strike-test.png" width="420" style="border:1px solid #ccc"><figcaption><b>strike-test</b> (Manual p.34)<br>Strike Test (steps 1 to 3): clamp one scrap of a welded test piece in a vise and hit the other with a heavy dead-blow hammer; a good weld bends and is not brittle, a poor weld snaps or cracks; wear ANSI-approved goggles; the test damages the weld it is performed on</figcaption></figure><figure style="margin:0;max-width:440px"><img src="cleaning-the-weld.png" width="420" style="border:1px solid #ccc"><figcaption><b>cleaning-the-weld</b> (Manual p.34)<br>Cleaning the weld (steps 1 and 2): WARNING keep wearing safety goggles and protective wear; knock off the slag from flux-cored or stick welds with a chipping hammer, then use a wire brush or an angle grinder to clean or shape the weld; pictures of the chipping hammer and wire brush</figcaption></figure><figure style="margin:0;max-width:440px"><img src="quick-start-wire-welding-steps.png" width="420" style="border:1px solid #ccc"><figcaption><b>quick-start-wire-welding-steps</b> (Quick-start guide p.1)<br>Quick Start Guide, page 1: wire welding in six steps: connect the cables, install the wire spool and clamp the wire into the feed mechanism, take off the nozzle and tip and feed wire with the cold wire feed switch, tighten the tension knob until the wire bends at 2 to 3 inches, replace the nozzle and tip, then plug in, turn on and set the weld thickness</figcaption></figure><figure style="margin:0;max-width:440px"><img src="quick-start-all-cable-setups.png" width="420" style="border:1px solid #ccc"><figcaption><b>quick-start-all-cable-setups</b> (Quick-start guide p.2)<br>Quick Start Guide, page 2: the cable setup for Stick, MIG, flux-cored and TIG on one page, with numbered cable diagrams for each process</figcaption></figure><figure style="margin:0;max-width:440px"><img src="quick-start-stick-cable-setup.png" width="420" style="border:1px solid #ccc"><figcaption><b>quick-start-stick-cable-setup</b> (Quick-start guide p.2)<br>Quick Start Guide, Stick cable setup: 1 connect the ground clamp to the negative terminal, 2 connect the electrode holder to the positive terminal, 3 leave the wire feed power disconnected</figcaption></figure><figure style="margin:0;max-width:440px"><img src="quick-start-mig-and-flux-cable-setup.png" width="420" style="border:1px solid #ccc"><figcaption><b>quick-start-mig-and-flux-cable-setup</b> (Quick-start guide p.2)<br>Quick Start Guide, MIG cable setup (ground clamp to negative, wire feed power to positive, MIG gun to the wire feed, wire feed control inside the welder) and the flux cable setup note: follow the MIG setup but connect the ground clamp to positive and the wire feed power to negative</figcaption></figure><figure style="margin:0;max-width:440px"><img src="quick-start-tig-cable-setup.png" width="420" style="border:1px solid #ccc"><figcaption><b>quick-start-tig-cable-setup</b> (Quick-start guide p.2)<br>Quick Start Guide, TIG cable setup: ground clamp to positive, TIG torch to negative, gas line to the gas regulator, foot pedal inside the welder, and leave the wire feed power disconnected</figcaption></figure></body>
